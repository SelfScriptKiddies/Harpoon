name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo clippy -- -D warnings

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Web UI
        run: |
          cd crates/harpoon-web
          npm ci
          npx vite build --outDir ../harpoon-app/src/ui/web/static --emptyOutDir
      - name: Build with all features
        run: cargo build --features "web,tls,regex-filter"
