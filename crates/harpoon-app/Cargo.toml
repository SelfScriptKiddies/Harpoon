[package]
name = "harpoon-app"
version = "0.1.0"
edition = "2021"
description = "Harpoon MITM/traffic-analysis proxy binary"

[[bin]]
name = "harpoon"
path = "src/main.rs"

[features]
default = []
regex-filter = ["harpoon-core/regex-filter"]

[dependencies]
harpoon-core = { path = "../harpoon-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["codec"] }
anyhow = "1"
libc = "0.2"
