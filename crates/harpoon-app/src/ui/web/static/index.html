<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harpoon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Login Page -->
  <div id="login-page">
    <div class="login-box">
      <h1>HARPOON</h1>
      <p>Transparent proxy admin panel</p>
      <div class="login-error"></div>
      <input type="text" id="login-username" placeholder="Username" value="admin">
      <input type="password" id="login-password" placeholder="Password">
      <button id="login-btn" class="btn btn-primary">Log In</button>
    </div>
  </div>

  <!-- Main Application -->
  <div id="app" style="display:none">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">HARPOON</div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="overview">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="1" width="6" height="6" rx="1"/>
            <rect x="9" y="1" width="6" height="6" rx="1"/>
            <rect x="1" y="9" width="6" height="6" rx="1"/>
            <rect x="9" y="9" width="6" height="6" rx="1"/>
          </svg>
          <span>Overview</span>
        </a>

        <a class="nav-item" data-page="rules">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" y1="3" x2="14" y2="3"/>
            <line x1="2" y1="8" x2="14" y2="8"/>
            <line x1="2" y1="13" x2="14" y2="13"/>
          </svg>
          <span>Rules</span>
        </a>

        <a class="nav-item" data-page="traffic">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1,12 4,5 7,9 10,2 14,7"/>
          </svg>
          <span>Live Traffic</span>
        </a>

        <a class="nav-item" data-page="sessions">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="4" cy="8" r="2.5"/>
            <circle cx="12" cy="8" r="2.5"/>
            <line x1="6.5" y1="8" x2="9.5" y2="8"/>
          </svg>
          <span>Sessions</span>
        </a>

        <a class="nav-item" data-page="tls">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="7" width="9" height="7" rx="1.5"/>
            <path d="M5 7V5a3 3 0 0 1 6 0v2"/>
          </svg>
          <span>TLS</span>
        </a>

        <a class="nav-item" data-page="exporters">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="2" x2="8" y2="10"/>
            <polyline points="4,6 8,2 12,6"/>
            <path d="M2 11v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2"/>
          </svg>
          <span>Exporters</span>
        </a>

        <a class="nav-item" data-page="events">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9,1 5,8.5 8,8.5 7,15 11,7.5 8,7.5"/>
          </svg>
          <span>Events</span>
        </a>

        <a class="nav-item" data-page="logs">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1.5" y="2" width="13" height="12" rx="1.5"/>
            <line x1="4" y1="6" x2="6" y2="6"/>
            <line x1="7" y1="6" x2="12" y2="6"/>
            <line x1="4" y1="9" x2="5" y2="9"/>
            <line x1="6" y1="9" x2="10" y2="9"/>
          </svg>
          <span>Logs</span>
        </a>

        <a class="nav-item" data-page="nftables">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="12" height="4" rx="1"/>
            <rect x="2" y="7" width="12" height="4" rx="1"/>
            <line x1="5" y1="11" x2="5" y2="14"/>
            <line x1="11" y1="11" x2="11" y2="14"/>
          </svg>
          <span>nftables</span>
        </a>

        <a class="nav-item" data-page="config">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="2"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4"/>
          </svg>
          <span>Config</span>
        </a>

        <a class="nav-item" data-page="system">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1.5" y="2" width="13" height="10" rx="1.5"/>
            <line x1="5" y1="14" x2="11" y2="14"/>
            <line x1="8" y1="12" x2="8" y2="14"/>
          </svg>
          <span>System</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span class="version">harpoon v0.1.0</span>
        <button id="btn-reload" class="btn btn-sm">Reload</button>
        <button id="btn-shutdown" class="btn btn-sm btn-danger">Shutdown</button>
      </div>
    </div>

    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-status">
        <span class="status-dot"></span>
        <span class="status-label">Connected</span>
      </div>

      <div class="topbar-chips">
        <span class="chip" id="chip-rules">Rules: 0</span>
        <span class="chip" id="chip-tcp">TCP: 0</span>
        <span class="chip" id="chip-udp">UDP: 0</span>
        <span class="chip" id="chip-uptime">Uptime: --</span>
      </div>

      <div class="topbar-actions">
        <button id="btn-create-rule" class="btn btn-accent">Create Rule</button>
        <button id="btn-refresh" class="btn">Refresh</button>
        <button id="btn-logout" class="btn">Logout</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main">
      <div id="page-overview" class="page active"></div>
      <div id="page-rules" class="page"></div>
      <div id="page-traffic" class="page"></div>
      <div id="page-sessions" class="page"></div>
      <div id="page-tls" class="page"></div>
      <div id="page-exporters" class="page"></div>
      <div id="page-events" class="page"></div>
      <div id="page-logs" class="page"></div>
      <div id="page-nftables" class="page"></div>
      <div id="page-config" class="page"></div>
      <div id="page-system" class="page"></div>
    </div>

  </div>

  <!-- Toast Notifications -->
  <div class="toast-area"></div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" hidden></div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/rules.js"></script>
  <script src="js/pages/traffic.js"></script>
  <script src="js/pages/sessions.js"></script>
  <script src="js/pages/tls.js"></script>
  <script src="js/pages/exporters.js"></script>
  <script src="js/pages/events.js"></script>
  <script src="js/pages/logs.js"></script>
  <script src="js/pages/nftables.js"></script>
  <script src="js/pages/config.js"></script>
  <script src="js/pages/system.js"></script>

</body>
</html>
