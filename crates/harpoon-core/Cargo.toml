[package]
name = "harpoon-core"
version = "0.1.0"
edition = "2021"
description = "Traffic processing engine for Harpoon proxy"

[features]
default = []
regex-filter = ["regex"]
tls = ["tokio-rustls", "rustls", "rustls-pemfile", "rcgen", "rustls-pki-types", "webpki-roots"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2"
tracing = "0.1"
bytes = "1"
regex = { version = "1", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = { version = "2", optional = true }
rcgen = { version = "0.13", optional = true }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }
